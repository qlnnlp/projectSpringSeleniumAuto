name: Test Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  automation-tests:
    name: Run Containerized Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'

      # Предварительно создаем папку с правами пользователя runner
      - name: Prepare Report Directories
        run: mkdir -p target/allure-results

      - name: Run Tests via Docker Compose
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from test-runner
        continue-on-error: true

      # Выравниваем права на созданные контейнером файлы Allure
      - name: Fix Directory Permissions
        if: always()
        run: sudo chown -R $USER:$USER target

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 7

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin