version: '3.8'

networks:
  qa-automation-network:
    driver: bridge

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-test-db
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d test_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - qa-automation-network

  selenium-chrome:
    image: selenium/standalone-chrome:4.29.0
    container_name: selenium-chrome
    shm_size: 2gb
    ports:
      - "4444:4444"
      - "7900:7900" # VNC веб-интерфейс для просмотра прогона в реальном времени (пароль: secret)
    environment:
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_SESSION_TIMEOUT=60
      - SE_VNC_NO_PASSWORD=1
    networks:
      - qa-automation-network

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-runner
    depends_on:
      postgres-db:
        condition: service_healthy
      selenium-chrome:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - APP_UI_REMOTE_URL=http://selenium-chrome:4444/wd/hub
      - APP_UI_HEADLESS=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/test_db
      - SPRING_DATASOURCE_USERNAME=qa_user
      - SPRING_DATASOURCE_PASSWORD=qa_password
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
    volumes:
      - ./target/allure-results:/app/target/allure-results
    networks:
      - qa-automation-network